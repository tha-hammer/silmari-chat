version: 1.3.13
cache: true

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_API_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'openai/gpt-oss-20b:free'
        fetch: true
      titleConvo: true
      titleModel: 'openai/gpt-oss-20b:free'
      modelDisplayLabel: 'OpenRouter'
      dropParams:
        - 'stop'

    # BAML compiled endpoint. The compiled clients (packages/api/baml_src/ns_host/clients.baml),
    # not this entry, own provider transport and credentials:
    #   OPENROUTER_API_KEY: authoritative provider credential (shared with the plain
    #     OpenRouter entry above)
    #   BAML_OPENROUTER_BASE_URL: authoritative provider base URL, production value
    #     https://openrouter.ai/api/v1
    #   OpenRouter: openai/gpt-oss-120b, FreePoolBackoff, max_retries: 4
    #   OpenRouterFast: openai/gpt-oss-20b, FastPoolBackoff, max_retries: 2
    - name: 'Team-BAML'
      provider: 'baml'
      models:
        default:
          - 'OpenRouter'
          - 'OpenRouterFast'
        fetch: false
      tokenConfig:
        OpenRouter:
          context: 131072
          prompt: 0.03
          completion: 0.17
        OpenRouterFast:
          context: 131072
          prompt: 0.03
          completion: 0.13
      customParams:
        defaultParamsEndpoint: 'baml'
      modelDisplayLabel: 'Team BAML'

    # Claude Agent SDK: spawns a local `claude` CLI subprocess per turn. Auth is
    # the CLI's own subscription login on the host running the server, not an
    # API key -- this endpoint declares no apiKey/baseURL/headers. Each turn's
    # subprocess is scoped (via packages/api/src/endpoints/custom/initialize.ts's
    # resolveClaudeAgentSdkWorkspace) to uploads/<the requesting user's own id>,
    # the same per-user directory the app's file-upload strategy already uses --
    # no cross-user filesystem access. `models.default` is cosmetic: this
    # provider has no per-request model selection (ClaudeAgentSDKClientOptions
    # has no `model` field), so there is exactly one selectable entry.
    - name: 'Claude Agent SDK'
      provider: 'claudeAgentSdk'
      models:
        default:
          - 'default'
        fetch: false
      customParams:
        defaultParamsEndpoint: 'claudeAgentSdk'
      modelDisplayLabel: 'Claude Agent SDK'
